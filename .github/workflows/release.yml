name: release

# Publishes a downloadable release. Two ways to trigger it:
#
#   1. Push a tag:   git tag v0.2.1 && git push origin v0.2.1
#   2. Actions tab -> "release" -> "Run workflow", and type the version.
#
# Either way the tests run first, the page is built, it is opened in a real
# browser and driven through a tournament, and only then is anything published.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0 (must match web/package.json)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Run the test suite
        run: node web/run-tests.js --not browser

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Drive the built file through a whole tournament
        run: node web/run-tests.js browser

      - name: Work out the version
        id: version
        env:
          # Passed through the environment rather than interpolated into the
          # script, so a crafted input cannot inject shell.
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          RAW="${INPUT_VERSION:-$REF_NAME}"
          VERSION="${RAW#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$'; then
            echo "::error::'$VERSION' does not look like a version (expected 1.2.3)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      - name: Build the release
        # release.js refuses to build if this disagrees with web/package.json,
        # so the program can never report a different version from the file
        # people downloaded.
        run: node web/release.js --version "${{ steps.version.outputs.version }}"

      - name: Check the artefact
        run: |
          set -euo pipefail
          test -s "dist/mahjong-tournament.html"
          # The page is the whole program, so nothing may be left for the
          # browser to go and fetch -- that is what makes it work offline.
          if grep -qE '<(script|link)[^>]+(src|href)="(https?:)?//' dist/mahjong-tournament.html; then
            echo "::error::the built page refers to something external"
            exit 1
          fi
          # And it should be one file, not a folder of them.
          if [ "$(find dist -type f | wc -l)" -ne 1 ]; then
            echo "::error::dist/ should hold exactly one file"
            find dist -type f
            exit 1
          fi
          echo "html: $(wc -c < dist/mahjong-tournament.html) bytes"

      - name: Write the release notes
        run: |
          set -euo pipefail
          cat > release-notes.md <<NOTES
          Run a Riichi Mahjong tournament from one file, in your browser, with no
          internet. Scoring follows
          [WRC 2025](https://www.worldriichi.org/wrc-rules), the ruleset the ARA's
          Tournament-in-a-Box guide uses.

          ## Download and run

          Download **\`mahjong-tournament.html\`** below and double-click it.

          That is the whole program, and the only file there is. No install, no
          Python, no server, nothing to unpack. It works with the wifi switched
          off, on Windows, macOS or Linux.

          ## New here?

          Click **Tutorial** in the top right. It builds a demo event and plays
          it through -- players, seating, scores, the cut, a final -- explaining
          each step, so you can see the whole thing working before your event
          depends on it. **Help**, next to it, has the same written out.

          ## First thing to do

          Open **Backups & print** and choose a backup folder.

          Your results live inside the browser while you work, and browser storage
          belongs to the browser rather than to the file. Copying the HTML to
          another laptop does **not** carry the tournament with it -- the backup
          folder is what makes the event real and portable.

          Pick a folder inside OneDrive, Google Drive or Dropbox and every round is
          copied off the laptop automatically: no account, no setup, the sync app
          you already have does it. (Choosing a folder needs Chrome or Edge; Safari
          and Firefox fall back to saving a backup file by hand.)

          ## What it does

          - Players, seating, score entry, standings, a cut to a top N, finals.
          - A draw that avoids repeat opponents, balances seat winds, moves people
            between tables and keeps clubs apart -- zero repeat pairings at up to
            100 players, in about a fifth of a second.
          - Score entry checked against 120,000 as you type, so a table that does
            not add up cannot be saved by accident.
          - Printable seating lists, per-table report sheets with the riichi-stick
            row and signature lines, sign-in sheets and table numbers.
          - Everything written out as CSV, including an append-only log of every
            score ever entered.

          See [docs/ORGANIZER_GUIDE.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/ORGANIZER_GUIDE.md)
          for running an event start to finish, and
          [docs/RULES.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/RULES.md)
          for every scoring setting and the rule it comes from.
          NOTES
          echo "--- notes ---"
          cat release-notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists. Bump the version and try again."
            exit 1
          fi
          gh release create "$TAG" \
            dist/mahjong-tournament.html \
            --title "Mahjong Tournament System $VERSION" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA"
          echo "Published: $(gh release view "$TAG" --json url --jq .url)"
